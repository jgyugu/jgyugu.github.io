<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A60 - Rooms 实体同人维基</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<script src="../components/sidebar.js"></script>

<div class="main">
  <h1 class="page-title">A60</h1>
  <div class="entity-card">
    <div class="entity-content">
      <h2>A60</h2>
      <p>A60 是目前唯一正式启用的A系列实体，核心定位为基础冲撞型追杀实体，行为逻辑简洁直接。</p >
      <p>实体将从游戏初始房间出发，沿房间路径向最新生成的房间进行连续冲撞，无复杂判定机制，是新手玩家遭遇的核心威胁之一。</p >
      <p>该实体无特殊触发条件，一旦房间生成数量达到阈值将自动激活，冲撞过程中会忽略部分障碍物，直接对路径上未隐蔽的玩家造成击杀判定。</p >
    </div>
    <div class="entity-info">
      <h4>A60</h4>
      <img src="../imgs/A60.jpg" alt="A60" class="entity-image">
      <div class="info-item">
        <span class="info-label">状态</span>
        <span class="info-value">✅ 已启用</span>
      </div>
      <div class="info-item">
        <span class="info-label">类型</span>
        <span class="info-value">冲撞类</span>
      </div>
      <div class="info-item">
        <span class="info-label">核心行为</span>
        <span class="info-value">连续冲撞</span>
      </div>
      <div class="info-item">
        <span class="info-label">威胁等级</span>
        <span class="info-value">中等</span>
      </div>
      <div class="info-item">
        <span class="info-label">触发条件</span>
        <span class="info-value">随机生成</span>
      </div>
    </div>
  </div>

  <script src="../components/footer.js"></script>
</div>

</body>
</html>
