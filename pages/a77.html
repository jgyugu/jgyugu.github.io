<div class="main">
  <h1 class="page-title">A77</h1>
  <div class="entity-card">
    <div class="entity-content">
      <h2>A77</h2>
      <p>A77 为开发中的追击类实体，移动逻辑已完善，具备克隆、房间检测、玩家锁定等多层行为机制，威胁等级高于A60。</p >
      <p>实体首先克隆自身实例，经过短暂延迟后获取房间路径坐标，以高速模式移动至目标房间入口；若检测到门关闭则自动消失，门开启时继续推进并检测玩家。</p >
      <p>当检测到玩家存在时，会向所有玩家发送信号，并生成击杀变体沿路径冲击；若处于小型房间且门关闭，将直接终止行动，未检测到玩家时会在两个房间范围内往复移动。</p >
    </div>
    <div class="entity-info">
      <h4>A77</h4>
      <img src="../imgs/A77.jpg" alt="A77" class="entity-image">
      <div class="info-item">
        <span class="info-label">状态</span>
        <span class="info-value">🛠️ 开发中</span>
      </div>
      <div class="info-item">
        <span class="info-label">类型</span>
        <span class="info-value">侦测追击类</span>
      </div>

        <span class="info-value">检查房间，生成击杀变体</span>
      </div>

      </div>
      <div class="info-item">
        <span class="info-label">完善进度</span>
        <span class="info-value">移动逻辑100%，正在开发击杀逻辑</span>
      </div>
    </div>
