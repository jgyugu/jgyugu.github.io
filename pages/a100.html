<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A100 - Rooms rooms of loop维基</title>
<link rel="icon" href="imgs/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<script src="../components/sidebar.js"></script>

<div class="main">
  <h1 class="page-title">A100</h1>
  <div class="entity-card">
    <div class="entity-content">
      <h2>A100</h2>
      <p>A100 为未启用的追击类实体，具备往返追击、隐蔽点标记与破坏等复杂行为，威胁等级较高。</p >
      <p>实体从主房间的下级房间生成，以1房间/秒的速度追击玩家过往位置，会击杀未躲藏或开启手电的玩家，并标记存在玩家的隐藏点。</p >
      <p>抵达终点后高速返回主房间，返程中破坏所有被标记的隐藏点(这会强制玩家退出该躲藏点)并击杀未躲藏玩家，最多执行3次往返，若储物柜数量不足则相应减少往返次数。</p >
    </div>
    <div class="entity-info">
      <h4>A100</h4>
      <img src="../imgs/placeholder.jpg" alt="A100" class="entity-image">
      <div class="info-item">
        <span class="info-label">状态</span>
        <span class="info-value">⬜ 未启用</span>
      </div>
      <div class="info-item">
        <span class="info-label">类型</span>
        <span class="info-value">追击类</span>
      </div>
      <div class="info-item">
        <span class="info-label">核心行为</span>
        <span class="info-value">往返追击、破坏隐蔽点</span>
      </div>
      <div class="info-item">
        <span class="info-label">威胁等级</span>
        <span class="info-value">高</span>
      </div>
      <div class="info-item">
        <span class="info-label">限制条件</span>
        <span class="info-value">最多3次往返</span>
      </div>
    </div>
  </div>

  <script src="../components/footer.js"></script>
</div>

</body>
</html>
